
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пользователи и публикации</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Пользователи и публикации</h1>

    <section class="panel">
      <label for="userId">ID пользователя (1–10)</label>

      <div class="search">
        <input id="userId" type="number" min="1" max="10"
               placeholder="Например, 1">
        <button id="userBtn">Найти</button>
      </div>

      <p id="mainStatus" class="status" role="status"></p>
      <div id="userInfo"></div>
    </section>

    <section class="panel">
      <h2>Публикации <span id="postCount"></span></h2>
      <p id="postsStatus" class="status" role="status"></p>
      <div id="posts"></div>
    </section>

    <section class="panel">
      <h2>Комментарии</h2>
      <p id="commentsStatus" class="status" role="status"></p>
      <div id="comments"></div>
    </section>
  </main>
</body>
</html>
