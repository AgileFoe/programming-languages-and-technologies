<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Каталог книг</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>

    <h1>Каталог книг</h1>

    <h2>Список книг</h2>

    <div id="books"></div>

    <section id="login">

        <h2>Авторизация</h2>

        <input id="username"
               placeholder="Логин">

        <input id="password"
               type="password"
               placeholder="Пароль">

        <button id="loginBtn">
            Войти
        </button>

        <p>Логин: student1</p>
        <p>Пароль: demo123</p>

    </section>

    <section id="editor" class="hidden">

        <h2>Добавить книгу</h2>

        <p id="user"></p>

        <input id="title"
               placeholder="Название книги">

        <input id="author"
               placeholder="Автор">

        <input id="year"
               type="number"
               placeholder="Год издания">

        <input id="genre"
               placeholder="Жанр">

        <button id="addBook">
            Добавить книгу
        </button>

        <button id="logout">
            Выйти
        </button>

    </section>

    <p id="message">
        Каталог доступен всем посетителям.
    </p>

</main>

<script src="app.js"></script>

</body>
</html>
