<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Система заметок</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>

    <h1>Система личных заметок</h1>

    <section id="login">

        <h2>Авторизация</h2>

        <input id="username"
               placeholder="Логин">

        <input id="password"
               type="password"
               placeholder="Пароль">

        <button id="loginBtn">
            Войти
        </button>

        <p>Логин: student1</p>
        <p>Пароль: demo123</p>

    </section>

    <section id="private" class="hidden">

        <h2>Мои заметки</h2>

        <p id="user"></p>

        <input id="noteText"
               placeholder="Введите заметку">

        <button id="addNote">
            Добавить
        </button>

        <button id="logout">
            Выйти
        </button>

        <div id="notes"></div>

    </section>

    <p id="message">
        Войдите, чтобы открыть заметки.
    </p>

</main>

<script src="app.js"></script>

</body>
</html>
