<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block slide</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #222;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 25px;
        }

        p {
            color: #ccc;
        }

        #game {
            position: relative;
            width: 800px;
            max-width: 90%;
            height: 500px;
            margin: 30px auto;
            background: #333;
            border: 4px solid #fff;
            overflow: hidden;
        }

        #player {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #00ff66;
            border-radius: 8px;
            left: 0;
            top: 0;
        }
    </style>
</head>

<body>

<h1>Block slide</h1>

<p>
    Управление: ↑ ↓ ← →
</p>

<div id="game">
    <div id="player"></div>
</div>

<script>
    const player = document.getElementById("player");
    const game = document.getElementById("game");

    let x = 0;
    let y = 0;

    const speed = 10;

    document.addEventListener("keydown", function(event) {

        const playerWidth = player.offsetWidth;
        const playerHeight = player.offsetHeight;

        const gameWidth = game.clientWidth;
        const gameHeight = game.clientHeight;

        if (event.key === "ArrowUp") {
            y -= speed;
        }

        if (event.key === "ArrowDown") {
            y += speed;
        }

        if (event.key === "ArrowLeft") {
            x -= speed;
        }

        if (event.key === "ArrowRight") {
            x += speed;
        }

        // Ограничение движения по горизонтали
        if (x < 0) {
            x = 0;
        }

        if (x > gameWidth - playerWidth) {
            x = gameWidth - playerWidth;
        }

        // Ограничение движения по вертикали
        if (y < 0) {
            y = 0;
        }

        if (y > gameHeight - playerHeight) {
            y = gameHeight - playerHeight;
        }

        player.style.left = x + "px";
        player.style.top = y + "px";

        // Запрещаем прокрутку страницы стрелками
        if (
            event.key === "ArrowUp" ||
            event.key === "ArrowDown" ||
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight"
        ) {
            event.preventDefault();
        }
    });
</script>

</body>
</html>
