<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Block slide</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #020617;
      font-family: Arial, sans-serif;
    }

    /* Игровое поле */
    #game {
      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background:
        linear-gradient(
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px
        );

      background-size: 40px 40px;
    }

    /* Счёт */
    #score {
      position: absolute;

      top: 20px;
      left: 20px;

      z-index: 20;

      padding: 10px 18px;

      color: white;

      background: rgba(15, 23, 42, 0.85);

      border: 1px solid #334155;
      border-radius: 10px;

      font-size: 20px;
      font-weight: bold;
    }

    /* Игрок */
    #player {
      position: absolute;

      width: 42px;
      height: 42px;

      background: #38bdf8;

      border-radius: 10px;

      box-shadow:
        0 0 12px #38bdf8,
        0 0 30px rgba(56, 189, 248, 0.6);

      z-index: 10;
    }

    /* Цель */
    #target {
      position: absolute;

      width: 32px;
      height: 32px;

      background: #22c55e;

      border-radius: 50%;

      box-shadow:
        0 0 12px #22c55e,
        0 0 30px rgba(34, 197, 94, 0.7);

      z-index: 5;

      animation: targetPulse 0.8s infinite alternate;
    }

    @keyframes targetPulse {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.2);
      }
    }

    /* Препятствия */
    .obstacle {
      position: absolute;

      background: #ef4444;

      border-radius: 8px;

      box-shadow:
        0 0 12px #ef4444,
        0 0 25px rgba(239, 68, 68, 0.5);

      z-index: 7;
    }

    /* Стартовое окно */
    #startScreen {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      z-index: 40;

      padding: 30px;

      min-width: 280px;

      text-align: center;

      color: white;

      background: rgba(15, 23, 42, 0.96);

      border: 1px solid #334155;

      border-radius: 16px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5);
    }

    #startScreen h1 {
      margin: 0 0 15px;

      font-size: 30px;
    }

    #startScreen p {
      margin: 8px 0;

      color: #94a3b8;

      line-height: 1.5;
    }

    /* Game Over */
    #gameOver {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      z-index: 50;

      min-width: 280px;

      padding: 30px;

      text-align: center;

      color: white;

      background: rgba(15, 23, 42, 0.96);

      border: 1px solid #334155;

      border-radius: 16px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5);

      display: none;
    }

    #gameOver h1 {
      margin: 0 0 10px;

      color: #ef4444;
    }

    #gameOver p {
      color: #94a3b8;
    }

    button {
      margin-top: 15px;

      padding: 12px 25px;

      border: none;

      border-radius: 10px;

      background: #38bdf8;

      color: #082f49;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      background: #7dd3fc;

      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.98);
    }

    @media (max-width: 600px) {

      #score {
        top: 10px;
        left: 10px;

        padding: 8px 13px;

        font-size: 16px;
      }

      #startScreen,
      #gameOver {
        width: 90%;
      }
    }
  </style>
</head>

<body>

  <div id="game">

    <!-- Счёт -->
    <div id="score">
      0
    </div>


    <!-- Игрок -->
    <div id="player"></div>


    <!-- Цель -->
    <div id="target"></div>


    <!-- Стартовое окно -->
    <div id="startScreen">

      <h1>🎮</h1>

      <p>
        Собирай зелёные цели
        и избегай красных препятствий.
      </p>

      <p>
        Можно одновременно нажимать
        несколько стрелок.
      </p>

      <button id="startButton">
        Начать
      </button>

    </div>


    <!-- Game Over -->
    <div id="gameOver">

      <h1>Игра окончена</h1>

      <p>
        Счёт:
        <strong id="finalScore">0</strong>
      </p>

      <button id="restart">
        Играть снова
      </button>

    </div>

  </div>


  <script>

    // =====================================
    // ЭЛЕМЕНТЫ
    // =====================================

    const game =
      document.getElementById("game");

    const player =
      document.getElementById("player");

    const target =
      document.getElementById("target");

    const scoreElement =
      document.getElementById("score");

    const startScreen =
      document.getElementById("startScreen");

    const startButton =
      document.getElementById("startButton");

    const gameOverScreen =
      document.getElementById("gameOver");

    const finalScore =
      document.getElementById("finalScore");

    const restartButton =
      document.getElementById("restart");


    // =====================================
    // НАСТРОЙКИ
    // =====================================

    const playerSize = 42;

    const targetSize = 32;

    const basePlayerSpeed = 350;


    // =====================================
    // ПОЗИЦИЯ ИГРОКА
    // =====================================

    let playerX = 100;

    let playerY = 100;


    // =====================================
    // ПОЗИЦИЯ ЦЕЛИ
    // =====================================

    let targetX = 500;

    let targetY = 300;


    // =====================================
    // СОСТОЯНИЕ ИГРЫ
    // =====================================

    let score = 0;

    let gameRunning = false;

    let lastTime = performance.now();


    // =====================================
    // ПРЕПЯТСТВИЯ
    // =====================================

    let obstacles = [];


    // =====================================
    // СОСТОЯНИЕ КЛАВИШ
    // =====================================

    const keys = {

      ArrowUp: false,

      ArrowDown: false,

      ArrowLeft: false,

      ArrowRight: false

    };


    // =====================================
    // СОЗДАНИЕ ЦЕЛИ
    // =====================================

    function createTarget() {

      const maxX =
        game.clientWidth -
        targetSize;

      const maxY =
        game.clientHeight -
        targetSize;


      let newX;
      let newY;


      // Стараемся не создавать цель
      // прямо возле игрока

      do {

        newX =
          Math.random() * maxX;

        newY =
          Math.random() * maxY;

      } while (

        Math.hypot(
          newX - playerX,
          newY - playerY
        ) < 120

      );


      targetX = newX;

      targetY = newY;


      target.style.left =
        targetX + "px";

      target.style.top =
        targetY + "px";
    }


    // =====================================
    // СОЗДАНИЕ ПРЕПЯТСТВИЯ
    // =====================================

    function createObstacle() {

      const obstacle =
        document.createElement("div");


      obstacle.classList.add(
        "obstacle"
      );


      /*
        Начальный размер препятствия.
      */

      const size = 30;


      obstacle.style.width =
        size + "px";

      obstacle.style.height =
        size + "px";


      let x;
      let y;


      // Не создаём препятствие
      // слишком близко к игроку

      do {

        x =
          Math.random() *
          (game.clientWidth - size);

        y =
          Math.random() *
          (game.clientHeight - size);

      } while (

        Math.hypot(
          x - playerX,
          y - playerY
        ) < 180

      );


      obstacle.style.left =
        x + "px";

      obstacle.style.top =
        y + "px";


      game.appendChild(
        obstacle
      );


      // Случайное направление

      const angle =
        Math.random() *
        Math.PI *
        2;


      /*
        Начальная скорость.
      */

      const obstacleSpeed = 70;


      obstacles.push({

        element: obstacle,

        x: x,

        y: y,

        size: size,

        vx:
          Math.cos(angle) *
          obstacleSpeed,

        vy:
          Math.sin(angle) *
          obstacleSpeed

      });

    }


    // =====================================
    // УВЕЛИЧЕНИЕ СЛОЖНОСТИ
    // =====================================

    function increaseDifficulty() {

      /*
        Эта функция вызывается
        ПОСЛЕ КАЖДОЙ СОБРАННОЙ ЦЕЛИ.
      */


      // Увеличиваем существующие
      // препятствия

      obstacles.forEach(
        obstacle => {

          // Увеличение размера

          obstacle.size += 5;


          // Максимальный размер

          obstacle.size =
            Math.min(
              obstacle.size,
              100
            );


          obstacle.element.style.width =
            obstacle.size + "px";

          obstacle.element.style.height =
            obstacle.size + "px";


          // Увеличиваем скорость

          obstacle.vx *= 1.08;

          obstacle.vy *= 1.08;

        }
      );


      /*
        Добавляем новое препятствие
        после каждой цели.
      */

      createObstacle();

    }


    // =====================================
    // ДВИЖЕНИЕ ПРЕПЯТСТВИЙ
    // =====================================

    function moveObstacles(deltaTime) {

      obstacles.forEach(
        obstacle => {

          obstacle.x +=
            obstacle.vx *
            deltaTime;

          obstacle.y +=
            obstacle.vy *
            deltaTime;


          // Отскок от левой
          // и правой стены

          if (
            obstacle.x <= 0 ||
            obstacle.x +
            obstacle.size >=
            game.clientWidth
          ) {

            obstacle.vx *= -1;

          }


          // Отскок от верхней
          // и нижней стены

          if (
            obstacle.y <= 0 ||
            obstacle.y +
            obstacle.size >=
            game.clientHeight
          ) {

            obstacle.vy *= -1;

          }


          // Не даём выйти за границы

          obstacle.x =
            Math.max(
              0,
              Math.min(
                obstacle.x,
                game.clientWidth -
                obstacle.size
              )
            );


          obstacle.y =
            Math.max(
              0,
              Math.min(
                obstacle.y,
                game.clientHeight -
                obstacle.size
              )
            );


          obstacle.element.style.left =
            obstacle.x + "px";

          obstacle.element.style.top =
            obstacle.y + "px";

        }
      );

    }


    // =====================================
    // СТОЛКНОВЕНИЕ С ПРЕПЯТСТВИЕМ
    // =====================================

    function checkObstacleCollision() {

      for (
        const obstacle of obstacles
      ) {

        if (

          playerX <
          obstacle.x +
          obstacle.size &&

          playerX +
          playerSize >
          obstacle.x &&

          playerY <
          obstacle.y +
          obstacle.size &&

          playerY +
          playerSize >
          obstacle.y

        ) {

          return true;

        }

      }


      return false;

    }


    // =====================================
    // СТОЛКНОВЕНИЕ С ЦЕЛЬЮ
    // =====================================

    function checkTargetCollision() {

      return (

        playerX <
        targetX +
        targetSize &&

        playerX +
        playerSize >
        targetX &&

        playerY <
        targetY +
        targetSize &&

        playerY +
        playerSize >
        targetY

      );

    }


    // =====================================
    // СБОР ЦЕЛИ
    // =====================================

    function collectTarget() {

      if (
        !checkTargetCollision()
      ) {

        return;

      }


      /*
        +10 очков
      */

      score += 10;


      scoreElement.textContent =
        score;


      /*
        Создаём новую цель
      */

      createTarget();


      /*
        СРАЗУ увеличиваем
        сложность после цели
      */

      increaseDifficulty();

    }


    // =====================================
    // GAME OVER
    // =====================================

    function endGame() {

      gameRunning = false;


      finalScore.textContent =
        score;


      gameOverScreen.style.display =
        "block";


      // Сбрасываем клавиши

      Object.keys(keys).forEach(
        key => {

          keys[key] = false;

        }
      );

    }


    // =====================================
    // ИГРОВОЙ ЦИКЛ
    // =====================================

    function gameLoop(currentTime) {

      if (!gameRunning) {

        requestAnimationFrame(
          gameLoop
        );

        return;

      }


      /*
        Сколько времени прошло
        с предыдущего кадра
      */

      const deltaTime =
        (currentTime - lastTime) /
        1000;


      lastTime =
        currentTime;


      // =================================
      // ДВИЖЕНИЕ ИГРОКА
      // =================================

      let dx = 0;

      let dy = 0;


      if (keys.ArrowUp) {

        dy -= 1;

      }


      if (keys.ArrowDown) {

        dy += 1;

      }


      if (keys.ArrowLeft) {

        dx -= 1;

      }


      if (keys.ArrowRight) {

        dx += 1;

      }


      /*
        Нормализация движения.

        Благодаря этому:

        ↑ = нормальная скорость

        → = нормальная скорость

        ↑ + → = такая же скорость,
        но по диагонали.
      */

      if (
        dx !== 0 ||
        dy !== 0
      ) {

        const length =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


        dx /= length;

        dy /= length;


        playerX +=
          dx *
          basePlayerSpeed *
          deltaTime;


        playerY +=
          dy *
          basePlayerSpeed *
          deltaTime;

      }


      // =================================
      // ГРАНИЦЫ ИГРОВОГО ПОЛЯ
      // =================================

      playerX =
        Math.max(
          0,
          Math.min(
            playerX,
            game.clientWidth -
            playerSize
          )
        );


      playerY =
        Math.max(
          0,
          Math.min(
            playerY,
            game.clientHeight -
            playerSize
          )
        );


      // =================================
      // ПОКАЗЫВАЕМ ИГРОКА
      // =================================

      player.style.left =
        playerX + "px";

      player.style.top =
        playerY + "px";


      // =================================
      // ДВИГАЕМ ПРЕПЯТСТВИЯ
      // =================================

      moveObstacles(
        deltaTime
      );


      // =================================
      // ПРОВЕРЯЕМ ЦЕЛЬ
      // =================================

      collectTarget();


      // =================================
      // ПРОВЕРЯЕМ ПРЕПЯТСТВИЯ
      // =================================

      if (
        checkObstacleCollision()
      ) {

        endGame();

      }


      // Следующий кадр

      requestAnimationFrame(
        gameLoop
      );

    }


    // =====================================
    // ЗАПУСК ИГРЫ
    // =====================================

    function startGame() {

      /*
        Удаляем старые препятствия
      */

      obstacles.forEach(
        obstacle => {

          obstacle.element.remove();

        }
      );


      obstacles = [];


      /*
        Начальная позиция игрока
      */

      playerX = 100;

      playerY = 100;


      /*
        Сбрасываем счёт
      */

      score = 0;

      scoreElement.textContent =
        "0";


      /*
        Создаём первую цель
      */

      createTarget();


      /*
        Первое препятствие
      */

      createObstacle();


      /*
        Запускаем игру
      */

      gameRunning = true;


      startScreen.style.display =
        "none";

      gameOverScreen.style.display =
        "none";


      lastTime =
        performance.now();

    }


    // =====================================
    // НАЖАТИЕ КЛАВИШ
    // =====================================

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          !keys.hasOwnProperty(
            event.key
          )
        ) {

          return;

        }


        event.preventDefault();


        /*
          Запоминаем нажатую клавишу.

          Можно одновременно держать:

          ↑ + →

          ↓ + ←

          ↑ + ←

          и т.д.
        */

        keys[event.key] = true;

      }
    );


    // =====================================
    // ОТПУСКАНИЕ КЛАВИШ
    // =====================================

    document.addEventListener(
      "keyup",
      function(event) {

        if (
          !keys.hasOwnProperty(
            event.key
          )
        ) {

          return;

        }


        event.preventDefault();


        keys[event.key] = false;

      }
    );


    // =====================================
    // ЗАЩИТА ОТ ЗАЛИПАНИЯ
    // =====================================

    window.addEventListener(
      "blur",
      function() {

        Object.keys(keys).forEach(
          key => {

            keys[key] = false;

          }
        );

      }
    );


    // =====================================
    // КНОПКИ
    // =====================================

    startButton.addEventListener(
      "click",
      startGame
    );


    restartButton.addEventListener(
      "click",
      startGame
    );


    // =====================================
    // ИНИЦИАЛИЗАЦИЯ
    // =====================================

    createTarget();


    requestAnimationFrame(
      gameLoop
    );

  </script>

</body>
</html>
